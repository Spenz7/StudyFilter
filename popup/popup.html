<html>
  <head>
    <style>
      body {
        min-width: 300px;
        padding: 10px;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- body section content is what users see upon opening the popup-->
    <h1>Do ur best!</h1>

    <!-- Add these buttons and status div -->
    <h3>Reddit Preferences</h3>
    <button id="add-whitelist">Add to Whitelist</button>
    <button id="remove-whitelist">Remove from Whitelist</button>
    <button id="add-blacklist">Add to Blacklist</button>
    <button id="remove-blacklist">Remove from Blacklist</button>
    <div id="status"></div>

    <div>
      <strong>Whitelist:</strong>
      <ul id="whitelist-list"></ul>
    </div>
    <div>
      <strong>Blacklist:</strong>
      <ul id="blacklist-list"></ul>
    </div>

    <div style="margin-top: 20px;">
      <h3>YouTube Topic Preferences</h3>
      <label for="topicInput">Topic:</label>
      <input type="text" id="topicInput" placeholder="e.g. cooking">
      <button id="submitTopic">Submit</button>
      <div id="topicStatus" style="margin-top: 5px; color: red;"></div>

      <ul id="allowedTopicsList" style="margin-top: 10px;"></ul>
    </div>


    <!-- Script is a JS file that does sth in ur extension-->
    <!-- popup.js runs when the popup opens-->
    <!--Run the Js file pop.js inside this popup window-->
    <script type="module" src="popup.js"></script>

  </body>
</html>
