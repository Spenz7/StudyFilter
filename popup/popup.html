<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <input type="file" id="import-file" accept=".json" style="display:none;">
    <button id="import-settings">Import Settings</button>
    <button id="export-settings">Export Settings</button>

    <h3>Custom Reminder Image</h3>
    <label for="upload-reminder-image">Choose File</label>
    <span id="file-name">No file chosen</span>
    <input type="file" id="upload-reminder-image" accept="image/*" />

    <h3>Custom Reminder Messages</h3>
    <textarea id="reminder-textarea" rows="5" cols="40" placeholder="Enter up to 3 lines, separated by new lines"></textarea>
    <button id="save-reminder-text">Save Reminder Text</button>
    <div id="textStatus"></div>

    <h3>Site Preferences</h3>
    <div id="redditButtons">
      <button id="add-whitelist">Add to Whitelist</button>
      <button id="remove-whitelist">Remove from Whitelist</button>
      <button id="add-blacklist">Add to Blacklist</button>
      <button id="remove-blacklist">Remove from Blacklist</button>
    </div>

    <div id="redditLists">
      <div class="dropdown">
        <button class="dropdown-toggle" data-target="whitelist-list">Whitelist ▼</button>
        <ul id="whitelist-list" class="collapsible-list"></ul>
      </div>
      <div class="dropdown">
        <button class="dropdown-toggle" data-target="blacklist-list">Blacklist ▼</button>
        <ul id="blacklist-list" class="collapsible-list"></ul>
      </div>
    </div>

    <h3>YouTube Filtering Level</h3>
    <div id="filterLevelContainer">
      <p><strong>Current Mode:</strong> <span id="current-filter-mode">Loading...</span></p>
      <button id="strictFilter">Strict</button>
      <button id="lenientFilter">Lenient</button>
    </div>

    <h3>YouTube Topic Preferences</h3>
    <label for="topicInput">Topic:</label>
    <input type="text" id="topicInput" placeholder="e.g. cooking" />
    <button id="submitTopic">Submit</button>
    <div id="topicStatus"></div>
    <ul id="allowedTopicsList"></ul>

    <script type="module" src="popup.js"></script>
  </body>
</html>
